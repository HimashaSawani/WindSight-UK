services:
  backend:
    build:
      context: ./backend
    environment:
      WINDSIGHT_FRONTEND_ORIGINS: http://localhost:8080
      WINDSIGHT_INGESTION_ENABLED: ${WINDSIGHT_INGESTION_ENABLED:-true}
      WINDSIGHT_INGESTION_INTERVAL_SECONDS: ${WINDSIGHT_INGESTION_INTERVAL_SECONDS:-3600}
      WINDSIGHT_INGESTION_LOOKBACK_DAYS: ${WINDSIGHT_INGESTION_LOOKBACK_DAYS:-2}
      WINDSIGHT_INGESTION_FORECAST_OVERLAP_HOURS: ${WINDSIGHT_INGESTION_FORECAST_OVERLAP_HOURS:-6}
      WINDSIGHT_INGESTION_STORE_PATH: /data/ingestion.json
      WINDSIGHT_INGESTION_ADMIN_TOKEN: ${WINDSIGHT_INGESTION_ADMIN_TOKEN:-}
    expose:
      - "8000"
    volumes:
      - ingestion-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  ingestion-data:
